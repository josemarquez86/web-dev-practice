<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      .container {
        display: flex;
        flex-direction: row;
        gap: 10px;
        height: 200px;
        border: 2px dashed gray;
        align-items: center;
        justify-content: center;
      }
      .box {
        /* flex: 1; */
        background: steelblue;
        color: white;
        padding: 20px;
      }
      .box-b {
        flex: 1;
        background: steelblue;
        color: white;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">A</div>
      <div class="box-b">B</div>
      <div class="box">C</div>
    </div>
  </body>
</html>
