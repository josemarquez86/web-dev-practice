<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My First Page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 100px;
        transition: background-color 0.3s;
      }
      button {
        font-size: 20px;
        padding: 10px 20px;
      }
      .card {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .row {
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        min-width: 0;
        font-size: 20px;
        padding: 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        text-align: left;
      }
      li {
        padding: 10px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
      }
      li:hover {
        text-decoration: line-through;
      }
      #result {
        margin-top: 20px;
      }
      #result img {
        width: 96px;
        height: 96px;
        border-radius: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Hello, world</h1>
    <p id="message">I am building this myself.</p>
    <button id="myButton">Click me</button>

    <div class="card">
      <div class="row">
        <input type="text" id="taskInput" placeholder="Add a task" />
        <button id="AddButton">Add</button>
      </div>
      <ul id="taskList"></ul>
      <button id="clearButton">Clear all</button>
    </div>

    <div class="card">
      <h2>GitHub lookup</h2>
      <div class="row">
        <input type="text" id="userInput" placeholder="GitHub username" />
        <button id="lookupButton">Look up</button>
      </div>
      <div id="result"></div>
    </div>

    <script>
      const button = document.getElementById("myButton");
      const message = document.getElementById("message");
      let count = 0;

      button.addEventListener("click", function () {
        count = count + 1;
        message.textContent = "Clicked " + count + " times";
        document.body.style.backgroundColor = "lightblue";
      });

      const taskInput = document.getElementById("taskInput");
      const AddButton = document.getElementById("AddButton");
      const taskList = document.getElementById("taskList");
      const clearButton = document.getElementById("clearButton");

      function addTask(text) {
        const item = document.createElement("li");
        item.textContent = text;

        item.addEventListener("click", function () {
          item.remove();
          saveTasks();
        });

        taskList.appendChild(item);
      }

      function saveTasks() {
        const items = taskList.querySelectorAll("li");
        const tasks = [];
        items.forEach(function (item) {
          tasks.push(item.textContent);
        });
        localStorage.setItem("tasks", JSON.stringify(tasks));
      }

      function handleAdd() {
        const text = taskInput.value.trim();
        if (text === "") {
          return;
        }
        addTask(text);
        taskInput.value = "";
        saveTasks();
      }

      AddButton.addEventListener("click", handleAdd);

      taskInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          handleAdd();
        }
      });

      clearButton.addEventListener("click", function () {
        taskList.replaceChildren();
        saveTasks();
      });

      const saved = localStorage.getItem("tasks");
      if (saved) {
        JSON.parse(saved).forEach(function (text) {
          addTask(text);
        });
      }

      const userInput = document.getElementById("userInput");
      const lookupButton = document.getElementById("lookupButton");
      const result = document.getElementById("result");

      async function lookupUser() {
        const username = userInput.value.trim();
        if (username === "") {
          return;
        }

        result.textContent = "Loading...";

        try {
          const response = await fetch(
            "https://api.github.com/users/" + encodeURIComponent(username),
          );

          if (!response.ok) {
            result.textContent =
              "Couldn't load that user (error " + response.status + ")";
            return;
          }

          const data = await response.json();

          const avatar = document.createElement("img");
          avatar.src = data.avatar_url;
          avatar.alt = data.login;

          const heading = document.createElement("h3");
          heading.textContent = data.name || data.login;

          const stats = document.createElement("p");
          stats.textContent =
            data.public_repos +
            " public repos, " +
            data.followers +
            " followers";

          result.replaceChildren(avatar, heading, stats);
        } catch (error) {
          console.error(error);
          result.textContent =
            "Couldn't reach GitHub. Check your connection and try again.";
        }
      }

      lookupButton.addEventListener("click", lookupUser);

      userInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          lookupUser();
        }
      });
    </script>
  </body>
</html>
